services:
  - type: web
    name: vajranet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_platform && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vajranet-db
          property: connectionString
      - key: DEFAULT_WEATHER_PROVIDER
        value: open_meteo
      - key: WEATHER_CACHE_SECONDS
        value: "600"
      - key: FORECAST_CACHE_SECONDS
        value: "1800"
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: IMD_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

databases:
  - name: vajranet-db
    plan: free
